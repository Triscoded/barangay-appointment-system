<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Binubusan - Admin Login</title>
    <style>
        :root {
            --primary-blue: #1A365D;
            --accent-red: #9B2C2C;
            --accent-yellow: #D69E2E;
            --bg-light: #F7FAFC;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--primary-blue);
        }
        h2 { color: var(--primary-blue); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(26,54,93,0.1); }
        .btn-login { background: var(--primary-blue); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #2A4365; }
        .alert { background: #FED7D7; color: #9B2C2C; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Login</h2>
        <p style="text-align: center; color: #64748B; font-size: 0.85rem; margin-bottom: 25px;">Barangay Binubusan System</p>
        <div id="loginAlert" class="alert"></div>
        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>
    </div>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('loginAlert');

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/admin';
                } else {
                    alertBox.style.display = 'block';
                    alertBox.innerText = data.error || 'Login failed.';
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.innerText = 'Network error. Please try again.';
            }
        }
    </script>
</body>
</html>
