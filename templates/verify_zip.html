<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Security Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center text-gray-100">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase">Restricted Area</span>
            <h1 class="text-2xl font-black mt-3">Barangay Security Gateway</h1>
        </div>

        <form id="zipForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold text-center">(Enter 4-digit authentication PIN)</label>
                <input type="password" id="zipCode" maxlength="4" required class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-center font-mono tracking-widest text-lg focus:ring-2 focus:ring-amber-500 outline-none text-amber-400" placeholder="••••">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-gray-950 font-black py-3 rounded-xl shadow-lg transition">
                Authenticate Location
            </button>
        </form>
        <p id="errorMsg" class="hidden text-red-400 text-xs text-center mt-4 font-semibold"></p>
        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-gray-500 hover:text-gray-300 transition">&larr; Return to Resident Portal</a>
        </div>
    </div>

    <script>
        document.getElementById('zipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const zip = document.getElementById('zipCode').value;
            const res = await fetch('/api/verify-zip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ zip_code: zip })
            });
            const data = await res.json();
            if (res.ok) {
                window.location.reload();
            } else {
                const err = document.getElementById('errorMsg');
                err.innerText = data.error;
                err.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
